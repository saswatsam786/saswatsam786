<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="414" height="232" viewBox="0 0 414 232" fill="none">
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.scan { animation: scan 3.2s linear infinite; } @keyframes scan { from { transform: translateY(-14px); } to { transform: translateY(92px); } }</style>
<defs><radialGradient id="glow" cx="85%" cy="20%" r="60%"><stop offset="0" stop-color="#6A48F5" stop-opacity=".22"/><stop offset="1" stop-color="#6A48F5" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="413" height="231" rx="16" fill="#F6F8FA" stroke="#D8DEE4"/>
<rect x=".5" y=".5" width="413" height="231" rx="16" fill="url(#glow)"/>
<g transform="translate(300 40)"><text x="0" y="0" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve">     ---::     </text><text x="0" y="10" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve">   =====--:.   </text><text x="0" y="20" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve"> -==+++++=-:.  </text><text x="0" y="30" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve"> -=++****+=-:. </text><text x="0" y="40" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve">:-=++*#%#+=-:. </text><text x="0" y="50" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve"> :-==+***+=-:. </text><text x="0" y="60" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve"> .::--===--:.  </text><text x="0" y="70" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve">   ..:::::..   </text><text x="0" y="80" class="mono" font-size="9.5" font-weight="400" fill="#0891B2" text-anchor="start" letter-spacing="0" xml:space="preserve">               </text><rect class="scan" x="-4" y="0" width="96" height="6" fill="#0891B2" opacity=".25"/></g>
<text x="24" y="38" class="mono" font-size="10.5" font-weight="400" fill="#59636E" text-anchor="start" letter-spacing="1.6" >GO · WEBRTC · OPENCV</text>
<text x="24" y="70" class="sans" font-size="22" font-weight="700" fill="#1F2328" text-anchor="start" letter-spacing="-0.4" >SnapShell</text>
<text x="24" y="104" class="sans" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >Video calls between two terminals. It</text>
<text x="24" y="124" class="sans" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >streams your webcam as ASCII art over</text>
<text x="24" y="144" class="sans" font-size="13.5" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >WebRTC in under 100 ms. On Homebrew.</text>
