<rect x="201.9" y="182" width="53.5" height="26" rx="13.0" fill="#F6F8FA" stroke="#D8DEE4"/><text x="211.9" y="198.96" class="mono" font-size="11" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >Redis</text>
