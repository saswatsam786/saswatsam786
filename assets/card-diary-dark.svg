@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
.ink { stroke-dasharray: 60; animation: ink 4.5s ease-in-out infinite; }@keyframes ink { 0% { stroke-dashoffset: 60; } 40%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }.spark { transform-box: fill-box; transform-origin: center; animation: tw 2.6s ease-in-out infinite; }@keyframes tw { 0%, 100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1); opacity: 1; } }</style>
