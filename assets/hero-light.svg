<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="330" viewBox="0 0 840 330" fill="none">
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.halo { transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
@keyframes halo { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(3); opacity: 0; } }

.b1 { animation: d1 18s ease-in-out infinite alternate; }
.b2 { animation: d2 22s ease-in-out infinite alternate; }
.b3 { animation: d3 26s ease-in-out infinite alternate; }
@keyframes d1 { to { transform: translate(-70px, 40px); } }
@keyframes d2 { to { transform: translate(50px, -40px); } }
@keyframes d3 { to { transform: translate(60px, -30px); } }
.spin { transform-origin: 716px 150px; animation: spin 16s linear infinite; }
.spin2 { transform-origin: 716px 150px; animation: spin 28s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.bar { transform-box: fill-box; transform-origin: center; animation: eq 1.3s ease-in-out infinite; }
@keyframes eq { 0%, 100% { transform: scaleY(.3); } 50% { transform: scaleY(1); } }
</style>
<defs>
<clipPath id="c"><rect width="840" height="330" rx="18"/></clipPath>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1F2328" opacity="0.07"/></pattern>
<radialGradient id="fadeg" cx="70%" cy="45%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="fade"><rect width="840" height="330" fill="url(#fadeg)"/></mask>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#1F2328"/><stop offset="1" stop-color="#4A36C8"/></linearGradient>
<linearGradient id="arc" x1="0" x2="1"><stop offset="0" stop-color="#6A48F5"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="840" height="330" fill="#FFFFFF"/>
<g filter="url(#blur)" opacity="0.2">
<circle class="b1" cx="640" cy="40" r="150" fill="#6A48F5"/>
<circle class="b2" cx="800" cy="270" r="120" fill="#0891B2"/>
<circle class="b3" cx="430" cy="350" r="110" fill="#DB2777" opacity=".55"/>
</g>
<rect width="840" height="330" fill="url(#grid)" mask="url(#fade)"/>
</g>
<rect x=".5" y=".5" width="839" height="329" rx="18" stroke="#D8DEE4"/>
<circle cx="716" cy="150" r="52" stroke="#D8DEE4" opacity="0.9"/>
<circle cx="716" cy="150" r="78" stroke="#D8DEE4" opacity="0.7"/>
<circle cx="716" cy="150" r="104" stroke="#D8DEE4" opacity="0.5"/>
<circle class="spin" cx="716" cy="150" r="78" stroke="url(#arc)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="110 380"/>
<g class="spin2"><circle cx="820" cy="150" r="4" fill="#0891B2"/></g>
<rect class="bar" x="689" y="143.0" width="4" height="14" rx="2" fill="url(#arc)" style="animation-delay:-0.00s"/>
<rect class="bar" x="697" y="137.0" width="4" height="26" rx="2" fill="url(#arc)" style="animation-delay:-0.17s"/>
<rect class="bar" x="705" y="130.0" width="4" height="40" rx="2" fill="url(#arc)" style="animation-delay:-0.34s"/>
<rect class="bar" x="713" y="135.0" width="4" height="30" rx="2" fill="url(#arc)" style="animation-delay:-0.51s"/>
<rect class="bar" x="721" y="128.0" width="4" height="44" rx="2" fill="url(#arc)" style="animation-delay:-0.68s"/>
<rect class="bar" x="729" y="138.0" width="4" height="24" rx="2" fill="url(#arc)" style="animation-delay:-0.85s"/>
<rect class="bar" x="737" y="144.0" width="4" height="12" rx="2" fill="url(#arc)" style="animation-delay:-1.02s"/>
<text x="56" y="88" class="mono" font-size="12.5" font-weight="400" fill="#59636E" text-anchor="start" letter-spacing="2" >SOFTWARE ENGINEER  ·  BENGALURU, INDIA</text>
<text x="53" y="154" class="sans" font-size="62" font-weight="700" fill="url(#name)" text-anchor="start" letter-spacing="-1.8" >Saswat Samal</text>
<text x="56" y="198" class="sans" font-size="20" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >I build AI agents, backends and cloud</text>
<text x="56" y="226" class="sans" font-size="20" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >infrastructure that hold up in production.</text>
<rect x="56.0" y="262" width="201.0" height="28" rx="14.0" fill="#F6F8FA" stroke="#D8DEE4"/><circle class="halo" cx="72.0" cy="276.0" r="4" fill="#1A7F37"/><circle cx="72.0" cy="276.0" r="4" fill="#1A7F37"/><text x="84.0" y="280.32" class="mono" font-size="12" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >Open to collaborations</text>
<rect x="267.0" y="262" width="214.3" height="28" rx="14.0" fill="#F6F8FA" stroke="#D8DEE4"/><text x="279.0" y="280.32" class="mono" font-size="12" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >Now · Aina, AI voice agent</text>
<rect x="491.4" y="262" width="229.0" height="28" rx="14.0" fill="#F6F8FA" stroke="#D8DEE4"/><text x="503.4" y="280.32" class="mono" font-size="12" font-weight="400" fill="#3D444D" text-anchor="start" letter-spacing="0" >OSS · Lima · Jaeger · Dynamo</text>
</svg>
