<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="150" viewBox="0 0 840 150" fill="none">
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.halo { transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
@keyframes halo { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(3); opacity: 0; } }
</style>
<defs><linearGradient id="line" gradientUnits="userSpaceOnUse" x1="110" y1="48" x2="730" y2="48"><stop offset="0" stop-color="#6A48F5" stop-opacity=".25"/><stop offset="1" stop-color="#6A48F5"/></linearGradient></defs>
