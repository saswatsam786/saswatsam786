name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6A48F5&color_dots=#EBEDF0,#DDD5FF,#BBA9FF,#9479FF,#6A48F5
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B6CFF&color_dots=#161B22,#2B2452,#463A9E,#6A55DD,#8B6CFF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
